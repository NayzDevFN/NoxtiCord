<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — NoxtiCord</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a1f16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%235865f2'/%3E%3Cpath d='M19 47V17h9l9 14 9-14h9v30h-9V31l-9 13-9-13v16z' fill='%2317181c'/%3E%3C/svg%3E">
<style>
  :root{
    --desk:#2b2016;--paper:#f7edd6;--paper2:#f2e6c9;--paper-hi:#fbf5e4;
    --edge:#d8c49a;--ink:#2f2519;--muted:#6d5d45;--line:#cbb68d;
    --red:#b4342c;--tape:rgba(233,220,180,.55);
    --font:Georgia,"Iowan Old Style","Times New Roman",serif;
    --hand:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:
      repeating-linear-gradient(92deg,rgba(0,0,0,.16) 0 3px,rgba(255,255,255,.015) 3px 7px,transparent 7px 34px),
      linear-gradient(115deg,#33261a,#241a11 55%,#2f2217);
    color:var(--ink);font-family:var(--font);text-align:center;
  }
  a{color:#2f4b7c;text-decoration:underline;text-underline-offset:3px}
  code{font-family:"Cascadia Code","Consolas",monospace;background:#e9dbb8;border:1px solid var(--line);
       padding:3px 8px;border-radius:4px;font-size:13px;color:#29415e}
  /* feuille arrachée posée sur le bureau */
  .box{
    position:relative;max-width:540px;background:var(--paper);border:1px solid var(--edge);
    padding:52px 40px 44px;transform:rotate(-1.2deg);
    box-shadow:10px 0 0 -2px #efe3c4, -10px 0 0 -2px #efe3c4, 0 30px 60px rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(0deg,rgba(120,90,40,.028) 0 1px,transparent 1px 4px);
  }
  .box::before,.box::after{
    content:"";position:absolute;top:-13px;width:110px;height:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.6),var(--tape) 50%,rgba(196,178,133,.42));
    box-shadow:0 2px 4px rgba(60,40,15,.18);opacity:.92
  }
  .box::before{left:8%;transform:rotate(-6deg)}
  .box::after{right:8%;transform:rotate(5deg)}
  .code{
    font-size:clamp(64px,16vw,110px);font-weight:700;letter-spacing:-.02em;line-height:1;
    color:var(--red);border:4px double var(--red);display:inline-block;padding:6px 26px;
    border-radius:8px;transform:rotate(-3deg);opacity:.85;font-family:var(--mono)
  }
  h1{font-size:24px;margin:22px 0 8px;font-weight:700}
  .note{font-family:var(--hand);font-size:17px;color:var(--red);margin:0 0 12px;transform:rotate(-1deg)}
  p{color:var(--muted);margin:0 0 26px;line-height:1.65}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:8px;
    font-size:15px;font-weight:700;text-decoration:none;transition:.16s
  }
  .btn:hover{text-decoration:none;transform:translateY(-2px)}
  .btn-main{background:linear-gradient(180deg,#c0402f,#a02f26);color:#fdf6e6;border:1px solid #7c241d;
            box-shadow:3px 4px 0 rgba(60,25,10,.35);transform:rotate(-.6deg)}
  .btn-main:hover{transform:rotate(-.6deg) translateY(-2px)}
  .btn-ghost{background:var(--paper2);border:2px solid var(--ink);color:var(--ink);
             box-shadow:3px 4px 0 rgba(60,40,15,.2)}
</style>
</head>
<body>
  <div class="box">
    <p class="note">// cette page a sauté…</p>
    <div class="code">404</div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être périmé, ou le fichier a bougé.
       L'installateur, lui, est juste là : <code>nayzdevfn.github.io/NoxtiCord/</code></p>
    <div class="btns">
      <a class="btn btn-main" href="/NoxtiCord/">↩ Retour au site</a>
      <a class="btn btn-ghost" href="https://github.com/NayzDevFN/NoxtiCord" target="_blank" rel="noopener">Voir sur GitHub ↗</a>
    </div>
  </div>
</body>
</html>
